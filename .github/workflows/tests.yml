# push 할 때마다 테스트와 공개 위생 검사를 돌린다. 배포는 하지 않는다 (ADR 0016).
# 테스트는 LLM 을 부르지 않으므로 API 키가 필요 없다.
# 단계는 공용 워크플로(fairyofdata/Concordia)가 맡는다 (ADR 0024).
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    uses: fairyofdata/Concordia/.github/workflows/python-tests.yml@v1
    with:
      python-versions: '["3.14"]'
      install: python -m pip install -r requirements.txt
      test: python -m pytest -q

  hygiene:
    uses: fairyofdata/Concordia/.github/workflows/hygiene.yml@v1
