# push 할 때마다 테스트를 돌린다. 배포는 하지 않는다 (ADR 0016).
# 테스트는 LLM 을 부르지 않으므로 API 키가 필요 없다.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
